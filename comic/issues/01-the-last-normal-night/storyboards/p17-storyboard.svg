<svg xmlns="http://www.w3.org/2000/svg" width="2063" height="3150" viewBox="0 0 2063 3150"><rect width="2063" height="3150" fill="#0b0d10"/><style>.p{fill:#bdbdbd;stroke:#fff;stroke-width:8}.l{font:700 32px Arial;fill:#fff}.n{font:27px Arial;fill:#ddd}.ink{stroke:#222;stroke-width:15;fill:none}.b{fill:#fff;stroke:#111;stroke-width:7}.d{font:700 34px Arial;fill:#111}.sfx{font:700 42px Arial;fill:#111}</style><text x="83" y="78" class="l">EP1 PAGE 17 — ALTERED REALITY INDEXES HIM</text><rect class="p" x="83" y="126" width="1897" height="693"/><text x="110" y="185" class="l">P17.1 — CLOSED STOREFRONTS / INDISTINCT WATCHERS</text><g fill="#8b8b8b" stroke="#222" stroke-width="8"><rect x="240" y="330" width="400" height="360"/><rect x="820" y="330" width="400" height="360"/><rect x="1400" y="330" width="400" height="360"/></g><circle cx="1020" cy="520" r="48" fill="#555"/><circle cx="1570" cy="520" r="42" fill="#555"/><text x="110" y="770" class="n">Figures are indistinct and plausibly reflections. Do not turn them into monsters.</text><rect class="p" x="83" y="945" width="908" height="882"/><text x="110" y="1004" class="l">P17.2 — ENGINE STARTS BEFORE KEY ENTERS</text><circle cx="480" cy="1330" r="85" fill="#333"/><line x1="480" y1="1415" x2="480" y2="1660" class="ink"/><text x="580" y="1510" class="sfx">RRRRMM</text><rect class="b" x="210" y="1580" width="260" height="120" rx="40"/><text x="300" y="1660" class="d">No.</text><rect class="p" x="1073" y="945" width="908" height="882"/><text x="1100" y="1004" class="l">P17.3 — KEY STILL IN HAND</text><path d="M1350 1280 q140 -130 280 0 q-60 120 -140 220" fill="#777" stroke="#222" stroke-width="10"/><line x1="1490" y1="1500" x2="1680" y2="1670" class="ink"/><circle cx="1715" cy="1700" r="38" fill="none" stroke="#222" stroke-width="12"/><text x="1120" y="1770" class="n">Key clearly visible. Engine is already running.</text><rect class="p" x="83" y="1953" width="1897" height="1071"/><text x="110" y="2012" class="l">P17.4 — RADIO WAKES TO 03</text><rect x="530" y="2250" width="1000" height="520" fill="#555" stroke="#222" stroke-width="14"/><rect x="710" y="2370" width="640" height="230" fill="#151515" stroke="#111" stroke-width="10"/><text x="930" y="2535" style="font:700 110px monospace;fill:#fff">03</text><text x="1240" y="2860" class="sfx">KSSSSHHH</text><text x="110" y="2970" class="n">No conventional station label. This is the first unexplained Frequency Three intrusion.</text></svg>