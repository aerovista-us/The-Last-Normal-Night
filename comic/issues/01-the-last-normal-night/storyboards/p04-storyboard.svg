<svg xmlns="http://www.w3.org/2000/svg" width="2063" height="3150" viewBox="0 0 2063 3150"><rect width="2063" height="3150" fill="#0b0d10"/><style>.p{fill:#bdbdbd;stroke:#fff;stroke-width:8}.l{font:700 31px Arial;fill:#fff}.n{font:26px Arial;fill:#ddd}.ink{stroke:#222;stroke-width:14;fill:none}.b{fill:#fff;stroke:#111;stroke-width:7}.d{font:700 30px Arial;fill:#111}.cap{fill:#f2ead8;stroke:#111;stroke-width:6}.c{font:700 29px Arial;fill:#111}</style><text x="83" y="78" class="l">EP1 PAGE 04 — FIRST DISMISSIBLE ANOMALY</text><rect class="p" x="83" y="126" width="1897" height="725"/><text x="110" y="185" class="l">P04.1 — WALKS NEAR RESIDENTIAL EDGE / DOG BARKS UPHILL</text><circle cx="760" cy="520" r="70" fill="#333"/><line x1="760" y1="590" x2="760" y2="810" class="ink"/><path d="M1420 580 q90 -120 180 0 q-20 110 -90 150" fill="#666" stroke="#222" stroke-width="10"/><text x="1510" y="430" style="font:700 40px Arial;fill:#111">WOOF. WOOF.</text><rect class="p" x="83" y="977" width="1897" height="630"/><text x="110" y="1036" class="l">P04.2 — SAME FRAMING, ONE BEAT LATER / COMPLETE STILLNESS</text><circle cx="760" cy="1330" r="70" fill="#333"/><line x1="760" y1="1400" x2="760" y2="1580" class="ink"/><path d="M1420 1390 q90 -120 180 0 q-20 110 -90 150" fill="#666" stroke="#222" stroke-width="10"/><text x="110" y="1550" class="n">No wind, bugs, bark, movement or SFX.</text><rect class="p" x="83" y="1733" width="825" height="693"/><text x="110" y="1792" class="l">P04.3 — CLOSE / JUST REGISTERS IT</text><circle cx="500" cy="2060" r="145" fill="#333"/><rect class="b" x="260" y="2200" width="220" height="110" rx="38"/><text x="330" y="2273" class="d">Huh.</text><rect class="p" x="83" y="2520" width="1897" height="504"/><text x="110" y="2579" class="l">P04.4 — CONTINUES WALKING / STREET TOO EMPTY BEHIND HIM</text><circle cx="560" cy="2780" r="60" fill="#333"/><line x1="560" y1="2840" x2="560" y2="3000" class="ink"/><line x1="850" y1="2990" x2="1840" y2="2990" class="ink"/><rect class="cap" x="1040" y="2650" width="700" height="130"/><text x="1100" y="2727" class="c">Then everything went still.</text><rect class="cap" x="1190" y="2810" width="520" height="115"/><text x="1250" y="2885" class="c">Didn’t notice then.</text></svg>