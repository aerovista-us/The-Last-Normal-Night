<svg xmlns="http://www.w3.org/2000/svg" width="2063" height="3150" viewBox="0 0 2063 3150"><rect width="2063" height="3150" fill="#0b0d10"/><style>.p{fill:#bdbdbd;stroke:#fff;stroke-width:8}.l{font:700 32px Arial;fill:#fff}.n{font:27px Arial;fill:#ddd}.ink{stroke:#222;stroke-width:14;fill:none}.b{fill:#fff;stroke:#111;stroke-width:7}.d{font:700 34px Arial;fill:#111}</style><text x="83" y="78" class="l">EP1 PAGE 19 — CURIOSITY OVER PANIC</text><rect class="p" x="83" y="126" width="1897" height="725"/><text x="110" y="185" class="l">P19.1 — FAMILIAR BLOCK, WRONG HISTORY</text><g fill="#777" stroke="#222" stroke-width="10"><rect x="220" y="350" width="430" height="380"/><rect x="790" y="270" width="520" height="460"/><path d="M1450 720 L1450 350 L1810 350 L1810 720 Z"/></g><path d="M1530 400 l210 260 M1740 410 l-220 250" class="ink"/><text x="110" y="805" class="n">One building occupies a remembered empty lot; another familiar business site is partly collapsed.</text><rect class="p" x="83" y="977" width="1897" height="630"/><text x="110" y="1036" class="l">P19.2 — BILLBOARD DATE GLITCHES BEFORE HE CAN READ IT</text><rect x="510" y="1170" width="1040" height="300" fill="#555" stroke="#222" stroke-width="12"/><text x="720" y="1360" style="font:700 84px monospace;fill:#bbb">20?—??</text><rect class="b" x="1570" y="1260" width="260" height="115" rx="40"/><text x="1640" y="1338" class="d">Shit.</text><rect class="p" x="83" y="1733" width="908" height="1292"/><text x="110" y="1792" class="l">P19.3 — STOPS / BREATHING HARD</text><circle cx="510" cy="2220" r="145" fill="#333"/><line x1="510" y1="2365" x2="510" y2="2740" class="ink"/><path d="M300 2140 Q510 2000 720 2140" stroke="#777" stroke-width="12" fill="none"/><text x="130" y="2920" class="n">Fear is real. No hero pose.</text><rect class="p" x="1073" y="1733" width="908" height="1292"/><text x="1100" y="1792" class="l">P19.4 — ONE SMALL INVOLUNTARY LAUGH</text><circle cx="1510" cy="2220" r="145" fill="#333"/><path d="M1455 2260 Q1510 2300 1565 2260" class="ink"/><rect class="b" x="1280" y="2550" width="460" height="130" rx="45"/><text x="1385" y="2635" class="d">Of course.</text><text x="1110" y="2920" class="n">Captions: I should’ve run. / Instead I laughed.</text></svg>