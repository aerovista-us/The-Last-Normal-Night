<svg xmlns="http://www.w3.org/2000/svg" width="2063" height="3150" viewBox="0 0 2063 3150"><rect width="2063" height="3150" fill="#0b0d10"/><style>.p{fill:#bdbdbd;stroke:#fff;stroke-width:8}.l{font:700 32px Arial;fill:#fff}.n{font:27px Arial;fill:#ddd}.ink{stroke:#222;stroke-width:14;fill:none}.door{fill:#b4814d;stroke:#fff;stroke-width:18}.b{fill:#fff;stroke:#111;stroke-width:7}.d{font:700 34px Arial;fill:#111}.sfx{font:700 42px Arial;fill:#111}</style><text x="62" y="70" class="l">EP1 PAGE 23 — CONSEQUENCE OF STAYING</text><rect class="p" x="62" y="95" width="1939" height="851"/><text x="90" y="154" class="l">P23.1 — DOORWAY SHIVERS / OLD WORLD DISTORTS</text><rect class="door" x="1230" y="240" width="520" height="570"/><path d="M1260 340 Q1400 280 1540 340 T1710 340 M1260 500 Q1400 440 1540 500 T1710 500 M1260 660 Q1400 600 1540 660 T1710 660" class="ink"/><circle cx="720" cy="500" r="80" fill="#333"/><line x1="720" y1="580" x2="720" y2="840" class="ink"/><text x="90" y="890" class="n">People inside never react to him.</text><rect class="p" x="62" y="1071" width="1939" height="756"/><text x="90" y="1130" class="l">P23.2 — RECTANGLE COLLAPSES TO A LINE</text><line x1="1420" y1="1230" x2="1420" y2="1720" stroke="#fff" stroke-width="24"/><circle cx="800" cy="1450" r="80" fill="#333"/><line x1="800" y1="1530" x2="800" y2="1760" class="ink"/><text x="1510" y="1500" class="sfx">TCHK</text><rect class="p" x="62" y="1953" width="1939" height="1103"/><text x="90" y="2012" class="l">P23.3 — ALONE / LAKE WIND RETURNS / WRONG DAWN</text><path d="M120 2860 L620 2300 L1100 2300 L1840 2860" class="ink"/><circle cx="810" cy="2520" r="85" fill="#333"/><line x1="810" y1="2605" x2="810" y2="2910" class="ink"/><rect x="1160" y="2620" width="480" height="230" rx="50" fill="#666" stroke="#222" stroke-width="10"/><path d="M1500 2140 Q1650 2050 1800 2140" stroke="#777" stroke-width="18" fill="none"/><rect class="b" x="980" y="2260" width="600" height="145" rx="48"/><text x="1050" y="2350" class="d">I ain’t going back.</text><text x="90" y="2990" class="n">Say it quietly. Dawn begins from the wrong direction. No victory pose.</text></svg>