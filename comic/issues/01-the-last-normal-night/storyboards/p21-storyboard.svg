<svg xmlns="http://www.w3.org/2000/svg" width="2063" height="3150" viewBox="0 0 2063 3150"><rect width="2063" height="3150" fill="#0b0d10"/><style>.p{fill:#bdbdbd;stroke:#fff;stroke-width:8}.l{font:700 32px Arial;fill:#fff}.n{font:27px Arial;fill:#ddd}.ink{stroke:#222;stroke-width:14;fill:none}.door{fill:#b4814d;stroke:#fff;stroke-width:20}.cap{fill:#f2ead8;stroke:#111;stroke-width:6}.c{font:700 32px Arial;fill:#111}</style><text x="83" y="78" class="l">EP1 PAGE 21 — RETURN IS EMOTIONALLY CREDIBLE</text><rect class="p" x="83" y="126" width="1897" height="693"/><text x="110" y="185" class="l">P21.1 — APPROACHES THRESHOLD / WARM LIGHT ON BOOTS</text><rect class="door" x="1370" y="290" width="400" height="430"/><circle cx="820" cy="470" r="70" fill="#333"/><line x1="820" y1="540" x2="820" y2="760" class="ink"/><path d="M690 720 L820 620 L950 720" fill="#d5ad73"/><rect class="p" x="83" y="945" width="908" height="851"/><text x="110" y="1004" class="l">P21.2 — FRIEND LAUGHS INSIDE OLD WORLD</text><rect class="door" x="250" y="1140" width="570" height="500"/><circle cx="500" cy="1370" r="80" fill="#444"/><path d="M455 1405 Q500 1440 545 1405" class="ink"/><text x="120" y="1735" class="n">Nobody notices protagonist yet.</text><rect class="p" x="1073" y="945" width="908" height="851"/><text x="1100" y="1004" class="l">P21.3 — OLD TRUCK / FAMILIAR STREET UNTOUCHED</text><rect class="door" x="1210" y="1140" width="620" height="500"/><rect x="1340" y="1370" width="370" height="180" rx="40" fill="#555" stroke="#222" stroke-width="10"/><text x="1110" y="1735" class="n">The old world looks safe because it is ordinary.</text><rect class="p" x="83" y="1922" width="1897" height="1103"/><text x="110" y="1981" class="l">P21.4 — INCHES FROM CROSSING</text><rect class="door" x="1250" y="2150" width="520" height="650"/><circle cx="970" cy="2400" r="110" fill="#333"/><line x1="970" y1="2510" x2="970" y2="2820" class="ink"/><line x1="970" y1="2740" x2="1180" y2="2860" class="ink"/><rect class="cap" x="160" y="2760" width="780" height="140"/><text x="220" y="2845" class="c">All I had to do was walk back through.</text><text x="110" y="2970" class="n">No dialogue. Hold the moment.</text></svg>