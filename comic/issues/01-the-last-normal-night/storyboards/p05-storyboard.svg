<svg xmlns="http://www.w3.org/2000/svg" width="2063" height="3150" viewBox="0 0 2063 3150"><rect width="2063" height="3150" fill="#0b0d10"/><style>.p{fill:#bdbdbd;stroke:#fff;stroke-width:8}.l{font:700 32px Arial;fill:#fff}.n{font:27px Arial;fill:#ddd}.ink{stroke:#222;stroke-width:14;fill:none}.lamp{fill:#e4d29a;stroke:#222;stroke-width:8}.b{fill:#fff;stroke:#111;stroke-width:7}.d{font:700 32px Arial;fill:#111}</style><text x="83" y="78" class="l">EP1 PAGE 05 — STREETLIGHT / SIGNAL STORYBOARD</text><rect class="p" x="83" y="126" width="1897" height="725"/><text x="110" y="185" class="l">P05.1 — STREETLIGHT AHEAD BURNS NORMALLY</text><line x1="1450" y1="300" x2="1450" y2="780" class="ink"/><circle cx="1450" cy="280" r="45" class="lamp"/><circle cx="650" cy="560" r="70" fill="#333"/><line x1="650" y1="630" x2="650" y2="810" class="ink"/><text x="110" y="805" class="n">He approaches on foot. No anomaly yet.</text><rect class="p" x="83" y="977" width="1897" height="630"/><text x="110" y="1036" class="l">P05.2 — DIRECTLY UNDER LAMP / IT CLICKS OFF</text><line x1="1030" y1="1130" x2="1030" y2="1530" class="ink"/><circle cx="1030" cy="1110" r="45" fill="#333" stroke="#222" stroke-width="8"/><circle cx="1030" cy="1360" r="70" fill="#333"/><line x1="1030" y1="1430" x2="1030" y2="1580" class="ink"/><text x="1240" y="1340" style="font:700 42px Arial;fill:#111">TCHK</text><rect class="p" x="83" y="1733" width="1897" height="630"/><text x="110" y="1792" class="l">P05.3 — LIGHT RETURNS BEHIND HIM / PHONE BARS CHANGE</text><line x1="450" y1="1870" x2="450" y2="2280" class="ink"/><circle cx="450" cy="1850" r="45" class="lamp"/><circle cx="1040" cy="2030" r="70" fill="#333"/><line x1="1040" y1="2100" x2="1040" y2="2300" class="ink"/><rect x="1220" y="1950" width="230" height="330" rx="40" fill="#222" stroke="#111" stroke-width="8"/><text x="1260" y="2135" style="font:700 42px Arial;fill:#fff">1 → 5 → 0</text><rect class="b" x="1500" y="2020" width="300" height="120" rx="42"/><text x="1560" y="2098" class="d">Come on.</text><rect class="p" x="83" y="2489" width="1897" height="535"/><text x="110" y="2548" class="l">P05.4 — EMPTY SIDEWALK / VOICE HAS NO VISIBLE SOURCE</text><line x1="320" y1="2940" x2="1760" y2="2940" class="ink"/><circle cx="650" cy="2720" r="70" fill="#333"/><line x1="650" y1="2790" x2="650" y2="2980" class="ink"/><rect class="b" x="1200" y="2590" width="400" height="120" rx="42"/><text x="1260" y="2668" class="d">Don’t go home.</text><rect class="b" x="760" y="2800" width="260" height="110" rx="40"/><text x="820" y="2875" class="d">Hello?</text><text x="110" y="2990" class="n">No person, no shadow figure, no movement.</text></svg>