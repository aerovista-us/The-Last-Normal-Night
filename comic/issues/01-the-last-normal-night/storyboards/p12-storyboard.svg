<svg xmlns="http://www.w3.org/2000/svg" width="2063" height="3150" viewBox="0 0 2063 3150"><rect width="2063" height="3150" fill="#0b0d10"/><style>.p{fill:#bdbdbd;stroke:#fff;stroke-width:8}.l{font:700 34px Arial;fill:#fff}.n{font:28px Arial;fill:#ddd}.ink{stroke:#222;stroke-width:15;fill:none}.wave{stroke:#666;stroke-width:16;fill:none}.sfx{font:700 46px Arial;fill:#111}.b{fill:#fff;stroke:#111;stroke-width:7}.d{font:700 34px Arial;fill:#111}</style><text x="62" y="70" class="l">EP1 PAGE 12 — STORYBOARD + LETTERING PROOF</text><rect class="p" x="62" y="95" width="1939" height="1197"/><text x="90" y="154" class="l">P12.1 — EMPTY INTERSECTION COMPRESSES TOWARD LAKE</text><line x1="220" y1="1160" x2="1840" y2="1160" class="ink"/><path d="M250 1120 L900 450 L1160 450 L1810 1120" class="ink"/><rect x="780" y="760" width="500" height="250" rx="50" fill="#666" stroke="#222" stroke-width="10"/><text x="90" y="1240" class="n">Truck stopped. Streetlights hum. Lake at end of street. Perspective feels compressed, but geography remains CDA.</text><rect class="p" x="83" y="1418" width="1897" height="504"/><text x="110" y="1477" class="l">P12.2 — SHADOW POINTS THE WRONG WAY</text><circle cx="700" cy="1670" r="70" fill="#333"/><line x1="700" y1="1740" x2="700" y2="1870" class="ink"/><path d="M700 1860 L1320 1800" stroke="#444" stroke-width="45" fill="none"/><text x="1380" y="1805" class="n">No matching light source.</text><rect class="p" x="62" y="2048" width="1939" height="1008"/><text x="90" y="2107" class="l">P12.3 — FIRST WOODEN-FLUTE REALITY-PROXIMITY SIGNAL</text><path d="M120 2550 Q220 2450 320 2550 T520 2550 T720 2550 T920 2550 T1120 2550 T1320 2550 T1520 2550 T1720 2550 T1940 2550" class="wave"/><path d="M160 2350 Q300 2260 440 2350 T720 2350 T1000 2350 T1280 2350 T1560 2350 T1900 2350" class="wave"/><text x="210" y="2700" class="sfx">WOOOOAARRRNNN</text><rect class="b" x="1180" y="2760" width="600" height="145" rx="50"/><text x="1240" y="2850" class="d">What the hell—</text><text x="90" y="3000" class="n">Pressure line should cross glass, puddles, dashboard plastic and lake reflection at once.</text></svg>