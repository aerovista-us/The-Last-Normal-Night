<svg xmlns="http://www.w3.org/2000/svg" width="2063" height="3150" viewBox="0 0 2063 3150"><rect width="2063" height="3150" fill="#0b0d10"/><style>.p{fill:#bdbdbd;stroke:#fff;stroke-width:8}.l{font:700 32px Arial;fill:#fff}.n{font:27px Arial;fill:#ddd}.ink{stroke:#222;stroke-width:14;fill:none}.door{fill:#b4814d;stroke:#fff;stroke-width:18}.cap{fill:#f2ead8;stroke:#111;stroke-width:6}.c{font:700 32px Arial;fill:#111}.b{fill:#fff;stroke:#111;stroke-width:7}.d{font:700 38px Arial;fill:#111}</style><text x="83" y="78" class="l">EP1 PAGE 22 — DEFINING CHOICE</text><rect class="p" x="83" y="126" width="908" height="693"/><text x="110" y="185" class="l">P22.1 — ONE STEP</text><rect class="door" x="560" y="290" width="300" height="420"/><line x1="350" y1="570" x2="540" y2="680" class="ink"/><rect class="cap" x="150" y="250" width="250" height="110"/><text x="220" y="322" class="c">One step.</text><rect class="p" x="1073" y="126" width="908" height="693"/><text x="1100" y="185" class="l">P22.2 — TWO</text><rect class="door" x="1280" y="250" width="520" height="500"/><line x1="1190" y1="570" x2="1390" y2="680" class="ink"/><rect class="cap" x="1120" y="250" width="180" height="110"/><text x="1180" y="322" class="c">Two.</text><rect class="p" x="83" y="945" width="1897" height="567"/><text x="110" y="1004" class="l">P22.3 — HE STOPS BEFORE CROSSING</text><circle cx="1020" cy="1230" r="75" fill="#333"/><line x1="1020" y1="1305" x2="1020" y2="1480" class="ink"/><rect class="door" x="1460" y="1060" width="320" height="390"/><text x="110" y="1460" class="n">No paralysis: this is an active pause.</text><rect class="p" x="83" y="1638" width="1897" height="567"/><text x="110" y="1697" class="l">P22.4 — LOOKS TOWARD ALTERED CDA</text><circle cx="740" cy="1910" r="85" fill="#333"/><line x1="740" y1="1995" x2="740" y2="2160" class="ink"/><path d="M1050 2130 L1350 1800 L1750 2130" class="ink"/><circle cx="1600" cy="1770" r="65" fill="none" stroke="#666" stroke-width="10"/><text x="110" y="2160" class="n">Moon ring + impossible buildings + dark lake. Fear and fascination together.</text><rect class="p" x="83" y="2331" width="1897" height="693"/><text x="110" y="2390" class="l">P22.5 — STEPS SIDEWAYS AWAY FROM THRESHOLD</text><rect class="door" x="1430" y="2470" width="350" height="430"/><circle cx="980" cy="2600" r="85" fill="#333"/><line x1="980" y1="2685" x2="980" y2="2920" class="ink"/><line x1="980" y1="2860" x2="760" y2="2940" class="ink"/><rect class="b" x="1090" y="2720" width="260" height="130" rx="45"/><text x="1165" y="2805" class="d">Nah.</text><text x="110" y="2980" class="n">Critical: sideways choice, not backing away in fear.</text></svg>