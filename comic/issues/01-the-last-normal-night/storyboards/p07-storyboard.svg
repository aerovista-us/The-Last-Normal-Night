<svg xmlns="http://www.w3.org/2000/svg" width="2063" height="3150" viewBox="0 0 2063 3150">
  <rect width="2063" height="3150" fill="#0b0d10"/>
  <style>
    .panel{fill:#c7c7c7;stroke:#f4f4f4;stroke-width:8}.ink{stroke:#1b1b1b;stroke-width:18;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#333;stroke-width:10;fill:none}.label{font:700 34px Arial,sans-serif;fill:#fff}.note{font:28px Arial,sans-serif;fill:#d8d8d8}.balloon{fill:#fff;stroke:#111;stroke-width:8}.dialog{font:700 36px Arial,sans-serif;fill:#111}.small{font:28px Arial,sans-serif;fill:#111}.ui{fill:#242424;stroke:#111;stroke-width:8}
  </style>
  <text x="83" y="78" class="label">EP1 PAGE 07 — STORYBOARD + LETTERING PROOF — 2063 × 3150</text>

  <!-- Panel 1 -->
  <rect class="panel" x="83" y="126" width="1897" height="756"/>
  <text x="110" y="180" class="label">P07.1 — LATE-NIGHT CONVENIENCE STORE / MUNDANE ESTABLISHING</text>
  <rect x="180" y="280" width="1550" height="470" fill="#9b9b9b" stroke="#222" stroke-width="12"/>
  <rect x="250" y="360" width="260" height="260" fill="#bdbdbd" stroke="#333" stroke-width="8"/>
  <rect x="1450" y="390" width="200" height="210" fill="#bdbdbd" stroke="#333" stroke-width="8"/>
  <line x1="640" y1="320" x2="640" y2="700" class="thin"/><line x1="930" y1="320" x2="930" y2="700" class="thin"/><line x1="1220" y1="320" x2="1220" y2="700" class="thin"/>
  <!-- protagonist --> <circle cx="520" cy="610" r="65" fill="#333"/><line x1="520" y1="675" x2="520" y2="815" class="ink"/><line x1="520" y1="720" x2="455" y2="790" class="ink"/><line x1="520" y1="720" x2="585" y2="790" class="ink"/>
  <!-- clerk --> <circle cx="1510" cy="500" r="55" fill="#444"/><line x1="1510" y1="555" x2="1510" y2="690" class="ink"/>
  <text x="110" y="840" class="note">Action: protagonist enters to buy water/gum. Fluorescent, ordinary, no horror treatment. No dialogue required here.</text>

  <!-- Panel 2 -->
  <rect class="panel" x="83" y="1008" width="908" height="851"/>
  <text x="110" y="1065" class="label">P07.2 — CLERK RECOGNIZES HIM</text>
  <circle cx="510" cy="1390" r="170" fill="#555"/>
  <path d="M380 1380 Q510 1320 640 1380" class="thin"/>
  <rect class="balloon" x="135" y="1115" rx="55" ry="55" width="560" height="180"/>
  <text x="180" y="1190" class="dialog">You picked</text><text x="180" y="1240" class="dialog">a good one.</text>
  <text x="145" y="1780" class="note">Expression: immediate recognition + quiet relief. Not sinister.</text>

  <!-- Panel 3 -->
  <rect class="panel" x="1073" y="1008" width="908" height="851"/>
  <text x="1100" y="1065" class="label">P07.3 — PROTAGONIST: CONFUSED</text>
  <circle cx="1510" cy="1390" r="170" fill="#3b3b3b"/>
  <path d="M1380 1370 Q1510 1320 1640 1370" class="thin"/>
  <rect class="balloon" x="1160" y="1120" rx="55" ry="55" width="480" height="145"/>
  <text x="1210" y="1210" class="dialog">Good what?</text>
  <rect x="1325" y="1630" width="330" height="90" fill="#777" stroke="#222" stroke-width="7"/>
  <text x="1120" y="1780" class="note">Card/cash paused in hand. Mild disbelief, not fear.</text>

  <!-- Panel 4 -->
  <rect class="panel" x="83" y="1985" width="1897" height="1039"/>
  <text x="110" y="2045" class="label">P07.4 — TWO-SHOT / SOCIAL WRONGNESS ONLY</text>
  <rect x="180" y="2200" width="1650" height="620" fill="#a8a8a8" stroke="#222" stroke-width="12"/>
  <line x1="1000" y1="2200" x2="1000" y2="2820" class="thin"/>
  <!-- protagonist --> <circle cx="650" cy="2460" r="115" fill="#333"/><line x1="650" y1="2575" x2="650" y2="2780" class="ink"/>
  <!-- clerk --> <circle cx="1370" cy="2450" r="105" fill="#555"/><line x1="1370" y1="2555" x2="1370" y2="2760" class="ink"/>
  <rect class="balloon" x="1180" y="2110" rx="55" ry="55" width="520" height="150"/>
  <text x="1230" y="2205" class="dialog">Have a good night.</text>
  <text x="110" y="2950" class="note">Clerk smile = normal, almost relieved. Protagonist studies him. END PAGE with no explanation.</text>
</svg>