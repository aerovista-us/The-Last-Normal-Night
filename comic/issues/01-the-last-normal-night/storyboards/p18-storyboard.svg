<svg xmlns="http://www.w3.org/2000/svg" width="2063" height="3150" viewBox="0 0 2063 3150"><rect width="2063" height="3150" fill="#0b0d10"/><style>.p{fill:#bdbdbd;stroke:#fff;stroke-width:8}.l{font:700 32px Arial;fill:#fff}.n{font:27px Arial;fill:#ddd}.ink{stroke:#222;stroke-width:15;fill:none}.wave{stroke:#666;stroke-width:13;fill:none}.b{fill:#fff;stroke:#111;stroke-width:7}.d{font:700 34px Arial;fill:#111}</style><text x="83" y="78" class="l">EP1 PAGE 18 — FREQUENCY THREE TEASE</text><rect class="p" x="83" y="126" width="1897" height="567"/><text x="110" y="185" class="l">P18.1 — STATIC FILLS CAB</text><circle cx="690" cy="430" r="85" fill="#333"/><line x1="690" y1="515" x2="690" y2="650" class="ink"/><rect x="1120" y="300" width="540" height="250" fill="#444" stroke="#222" stroke-width="10"/><text x="110" y="655" class="n">He leans toward radio cautiously.</text><rect class="p" x="83" y="819" width="908" height="788"/><text x="110" y="878" class="l">P18.2 — WAVEFORM BREATHES</text><path d="M170 1280 Q260 1120 350 1280 T530 1280 T710 1280 T890 1280" class="wave"/><path d="M170 1350 Q260 1480 350 1350 T530 1350 T710 1350 T890 1350" class="wave"/><rect class="p" x="1073" y="819" width="908" height="788"/><text x="1100" y="878" class="l">P18.3 — OLDER-SOUNDING VOICE</text><rect class="b" x="1190" y="1080" width="650" height="170" rx="50"/><text x="1250" y="1160" class="d">You finally made it.</text><text x="1110" y="1510" class="n">Voice is degraded but human. Do not visualize older-him.</text><rect class="p" x="83" y="1733" width="908" height="1292"/><text x="110" y="1792" class="l">P18.4 — PROTAGONIST FREEZES</text><circle cx="520" cy="2220" r="150" fill="#333"/><line x1="520" y1="2370" x2="520" y2="2700" class="ink"/><rect class="b" x="220" y="2600" width="520" height="145" rx="48"/><text x="300" y="2690" class="d">Who is this?</text><rect class="p" x="1073" y="1733" width="908" height="1292"/><text x="1100" y="1792" class="l">P18.5 — RADIO DIES</text><rect x="1240" y="2120" width="620" height="430" fill="#444" stroke="#222" stroke-width="12"/><rect x="1380" y="2240" width="340" height="150" fill="#121212" stroke="#111" stroke-width="8"/><text x="1470" y="2340" style="font:700 80px monospace;fill:#fff">03</text><text x="1100" y="2910" class="n">03 holds one beat, then display goes dark. No second answer.</text></svg>