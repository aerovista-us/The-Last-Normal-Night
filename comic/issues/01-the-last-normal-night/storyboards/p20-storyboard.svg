<svg xmlns="http://www.w3.org/2000/svg" width="2063" height="3150" viewBox="0 0 2063 3150"><rect width="2063" height="3150" fill="#0b0d10"/><style>.p{fill:#bdbdbd;stroke:#fff;stroke-width:8}.l{font:700 32px Arial;fill:#fff}.n{font:27px Arial;fill:#ddd}.ink{stroke:#222;stroke-width:14;fill:none}.tear{stroke:#fff;stroke-width:20;fill:none}.wave{stroke:#666;stroke-width:11;fill:none}.cap{fill:#f2ead8;stroke:#111;stroke-width:6}.c{font:700 34px Arial;fill:#111}</style><text x="62" y="70" class="l">EP1 PAGE 20 — DOORWAY BECOMES A CHOICE</text><rect class="p" x="62" y="95" width="1939" height="851"/><text x="90" y="154" class="l">P20.1 — THIN ELECTRICAL TEAR OPENS BEHIND HIM</text><circle cx="780" cy="520" r="85" fill="#333"/><line x1="780" y1="605" x2="780" y2="840" class="ink"/><path d="M1320 230 L1290 410 L1340 570 L1300 760 L1335 900" class="tear"/><path d="M1060 700 Q1180 620 1300 700 T1540 700 T1780 700" class="wave"/><text x="90" y="895" class="n">SFX: KRRRNNNN. Wooden-flute pressure returns quietly.</text><rect class="p" x="62" y="1071" width="1939" height="756"/><text x="90" y="1130" class="l">P20.2 — TEAR WIDENS INTO EXACT RECTANGLE</text><rect x="1220" y="1220" width="500" height="500" fill="#efefef" stroke="#fff" stroke-width="24"/><rect x="1260" y="1260" width="420" height="420" fill="#a87845" stroke="#442d19" stroke-width="8"/><text x="90" y="1770" class="n">Cold-white precise perimeter. Warm old-world image inside. No swirling portal effects.</text><rect class="p" x="62" y="1953" width="1939" height="1103"/><text x="90" y="2012" class="l">P20.3 — EXACT PRE-RUPTURE STREET INSIDE</text><rect x="440" y="2160" width="1180" height="700" fill="#a87845" stroke="#fff" stroke-width="20"/><rect x="600" y="2350" width="400" height="320" fill="#70482f"/><rect x="1110" y="2480" width="390" height="190" rx="45" fill="#555"/><circle cx="700" cy="2780" r="48" fill="#333"/><circle cx="820" cy="2780" r="48" fill="#333"/><rect class="cap" x="140" y="2740" width="300" height="