<svg xmlns="http://www.w3.org/2000/svg" width="2063" height="3150" viewBox="0 0 2063 3150"><rect width="2063" height="3150" fill="#0b0d10"/><style>.p{fill:#bdbdbd;stroke:#fff;stroke-width:8}.l{font:700 32px Arial;fill:#fff}.n{font:27px Arial;fill:#ddd}.ink{stroke:#222;stroke-width:14;fill:none}.car{fill:#777;stroke:#222;stroke-width:10}.display{fill:#202020;stroke:#111;stroke-width:8}.digits{font:700 82px monospace;fill:#fff}.b{fill:#fff;stroke:#111;stroke-width:7}.d{font:700 34px Arial;fill:#111}</style><text x="83" y="78" class="l">EP1 PAGE 06 — MEASURABLE CONTRADICTIONS STORYBOARD</text><rect class="p" x="83" y="126" width="1897" height="630"/><text x="110" y="185" class="l">P06.1 — SHERMAN FEELS SUBTLY TOO LONG</text><path d="M180 700 L720 300 L1340 300 L1880 700" class="ink"/><circle cx="1020" cy="520" r="70" fill="#333"/><line x1="1020" y1="590" x2="1020" y2="740" class="ink"/><text x="110" y="710" class="n">Caption: Walked downtown but the road felt stretched.</text><rect class="p" x="83" y="882" width="908" height="756"/><text x="110" y="941" class="l">P06.2 — WHITE SEDAN PASSES</text><rect class="car" x="240" y="1130" width="610" height="230" rx="55"/><path d="M300 1170 q-80 130 20 190" class="ink"/><circle cx="735" cy="1190" r="30" fill="#555"/><circle cx="795" cy="1190" r="30" fill="#aaa"/><text x="110" y="1570" class="n">Same dent + one dim tail light. Do not spotlight it.</text><rect class="p" x="1073" y="882" width="908" height="756"/><text x="1100" y="941" class="l">P06.3 — TWO BLOCKS LATER, SAME CAR AGAIN</text><rect class="car" x="1230" y="1130" width="610" height="230" rx="55"/><path d="M1290 1170 q-80 130 20 190" class="ink"/><circle cx="1725" cy="1190" r="30" fill="#555"/><circle cx="1785" cy="1190" r="30" fill="#aaa"/><circle cx="1180" cy="1470" r="55" fill="#333"/><text x="1110" y="1570" class="n">He recognizes the repeat. No teleport/glitch effect.</text><rect class="p" x="83" y="1764" width="908" height="1260"/><text x="110" y="1823" class="l">P06.4 — DIGITAL SIGN</text><rect class="display" x="235" y="2130" width="600" height="300"/><text x="350" y="2330" class="digits">11:58</text><rect class="p" x="1073" y="1764" width="908" height="1260"/><text x="1100" y="1823" class="l">P06.5 — SAME SIGN, SECONDS LATER</text><rect class="display" x="1225" y="2130" width="600" height="300"/><text x="1340" y="2330" class="digits">11:57</text><rect class="b" x="1370" y="2640" width="300" height="120" rx="42"/><text x="1450" y="2720" class="d">Wait.</text><text x="1110" y="2940" class="n">Hard rule: absolutely no 11:59 anywhere on this page.</text></svg>