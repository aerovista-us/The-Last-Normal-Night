<svg xmlns="http://www.w3.org/2000/svg" width="2063" height="3150" viewBox="0 0 2063 3150"><rect width="2063" height="3150" fill="#0b0d10"/><style>.p{fill:#bdbdbd;stroke:#fff;stroke-width:8}.l{font:700 34px Arial;fill:#fff}.n{font:28px Arial;fill:#ddd}.ink{stroke:#222;stroke-width:14;fill:none}.b{fill:#fff;stroke:#111;stroke-width:7}.d{font:700 34px Arial;fill:#111}.car{fill:#777;stroke:#222;stroke-width:10}</style><text x="83" y="78" class="l">EP1 PAGE 09 — STORYBOARD + LETTERING PROOF</text><rect class="p" x="83" y="126" width="1897" height="567"/><text x="110" y="185" class="l">P09.1 — WHITE SEDAN IDLING AHEAD</text><rect class="car" x="1180" y="340" width="460" height="170" rx="45"/><circle cx="1270" cy="520" r="48" fill="#222"/><circle cx="1550" cy="520" r="48" fill="#222"/><line x1="350" y1="630" x2="1750" y2="630" class="ink"/><text x="110" y="660" class="n">Intersection ahead. Same white sedan. No supernatural effect.</text><rect class="p" x="83" y="819" width="908" height="788"/><text x="110" y="878" class="l">P09.2 — DENT / DIM TAIL LIGHT</text><rect class="car" x="230" y="1060" width="590" height="240" rx="55"/><path d="M275 1110 Q250 1190 320 1250" class="ink"/><circle cx="690" cy="1150" r="34" fill="#555"/><circle cx="765" cy="1150" r="34" fill="#999"/><text x="120" y="1540" class="n">Close enough that readers know it is the same car.</text><rect class="p" x="1073" y="819" width="908" height="788"/><text x="1100" y="878" class="l">P09.3 — FIRST SIGNAL TURNS RED</text><circle cx="1450" cy="1220" r="70" fill="#444"/><line x1="1450" y1="1290" x2="1450" y2="1490" class="ink"/><rect x="1740" y="1010" width="90" height="250" fill="#333"/><circle cx="1785" cy="1060" r="28" fill="#ddd"/><text x="1590" y="1460" class="l">CLICK</text><rect class="p" x="83" y="1733" width="1897" height="630"/><text x="110" y="1792" class="l">P09.4 — SIGNALS CASCADE RED TOWARD LAKE</text><line x1="160" y1="2260" x2="1880" y2="2260" class="ink"/><g fill="#ddd"><circle cx="380" cy="2050" r="38"/><circle cx="700" cy="2020" r="34"/><circle cx="1020" cy="1990" r="30"/><circle cx="1340" cy="1960" r="26"/><circle cx="1660" cy="1930" r="22"/></g><text x="210" y="2160" class="l">CLICK. CLICK. CLICK. CLICK.</text><rect class="p" x="83" y="2489" width="1897" height="535"/><text x="110" y="2548" class="l">P09.5 — SAME STREET. CAR GONE.</text><circle cx="570" cy="2770" r="70" fill="#333"/><line x1="570" y1="2840" x2="570" y2="2960" class="ink"/><rect class="b" x="720" y="2650" width="280" height="120" rx="45"/><text x="790" y="2730" class="d">Nope.</text><text x="1120" y="2950" class="n">He turns back toward his truck. Do not show sedan leaving.</text></svg>