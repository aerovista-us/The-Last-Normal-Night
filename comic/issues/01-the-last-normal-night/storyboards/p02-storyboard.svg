<svg xmlns="http://www.w3.org/2000/svg" width="2063" height="3150" viewBox="0 0 2063 3150"><rect width="2063" height="3150" fill="#0b0d10"/><style>.p{fill:#bdbdbd;stroke:#fff;stroke-width:8}.l{font:700 31px Arial;fill:#fff}.n{font:26px Arial;fill:#ddd}.ink{stroke:#222;stroke-width:14;fill:none}.b{fill:#fff;stroke:#111;stroke-width:7}.d{font:700 28px Arial;fill:#111}.cap{fill:#f2ead8;stroke:#111;stroke-width:6}.c{font:700 30px Arial;fill:#111}</style><text x="83" y="78" class="l">EP1 PAGE 02 — ADULT SOCIAL NORMALITY</text><rect class="p" x="83" y="126" width="1897" height="756"/><text x="110" y="185" class="l">P02.1 — WORN BAR / FRIENDS / WARM NORMAL LIFE</text><rect x="220" y="340" width="1550" height="380" fill="#9a9a9a" stroke="#222" stroke-width="10"/><g fill="#444"><circle cx="520" cy="530" r="60"/><circle cx="850" cy="530" r="60"/><circle cx="1180" cy="530" r="60"/><circle cx="1510" cy="530" r="60"/></g><rect class="b" x="180" y="230" width="850" height="130" rx="45"/><text x="230" y="310" class="d">You still coming Monday or you gonna mysteriously become unavailable again?</text><rect class="b" x="1090" y="620" width="700" height="135" rx="45"/><text x="1140" y="700" class="d">Depends how committed I am to disappointing everybody.</text><rect class="p" x="83" y="1008" width="908" height="851"/><text x="110" y="1067" class="l">P02.2 — HALF-FULL BEER / LISTENING</text><rect x="390" y="1260" width="210" height="300" rx="35" fill="#777" stroke="#222" stroke-width="10"/><rect class="b" x="145" y="1115" width="420" height="120" rx="40"/><text x="210" y="1190" class="d">That’s healthy.</text><rect class="b" x="500" y="1590" width="350" height="120" rx="40"/><text x="560" y="1668" class="d">It’s efficient.</text><rect class="p" x="1073" y="1008" width="908" height="851"/><text x="1100" y="1067" class="l">P02.3 — FRIEND TALKS / HE GLANCES TOWARD WINDOW</text><circle cx="1350" cy="1370" r="90" fill="#444"/><circle cx="1690" cy="1370" r="90" fill="#333"/><rect class="b" x="1120" y="1120" width="740" height="155" rx="45"/><text x="1170" y="1190" class="d">She said “we need space” and then sent me twelve paragraphs.</text><rect class="b" x="1260" y="1600" width="600" height="120" rx="40"/><text x="1320" y="1678" class="d">That sounds like a lot of space.</text><rect class="p" x="83" y="1985" width="1897" height="1039"/><text x="110" y="2044" class="l">P02.4 — LAUGHTER / ATTENTION ALREADY DRIFTING OUTSIDE</text><g fill="#444"><circle cx="500" cy="2450" r="80"/><circle cx="800" cy="2450" r="80"/><circle cx="1100" cy="2450" r="80"/></g><circle cx="1450" cy="2450" r="90" fill="#333"/><rect x="1640" y="2210" width="230" height="470" fill="#666" stroke="#222" stroke-width="10"/><rect class="cap" x="180" y="2770" width="700" height="130"/><text x="240" y="2850" class="c">Old friends killing borrowed time.</text><text x="110" y="2970" class="n">Warm room. No anomaly. His glance toward outside is mild restlessness, not premonition.</text></svg>