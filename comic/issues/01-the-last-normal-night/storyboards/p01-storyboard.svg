<svg xmlns="http://www.w3.org/2000/svg" width="2063" height="3150" viewBox="0 0 2063 3150"><rect width="2063" height="3150" fill="#0b0d10"/><style>.l{font:700 34px Arial;fill:#fff}.n{font:28px Arial;fill:#ddd}.ink{stroke:#222;stroke-width:14;fill:none}.cap{fill:#f2ead8;stroke:#111;stroke-width:6}.c{font:700 31px Arial;fill:#111}</style><rect x="62" y="95" width="1939" height="2961" fill="#aeb2b5" stroke="#fff" stroke-width="8"/><text x="90" y="154" class="l">EP1 PAGE 01 — FULL-PAGE NORMAL-NIGHT SPLASH</text><path d="M120 2500 L660 1350 L1350 1350 L1940 2500" class="ink"/><rect x="120" y="2500" width="1820" height="430" fill="#7f8b92" stroke="#333" stroke-width="8"/><path d="M180 2280 L760 1800 L1320 1800 L1880 2280" class="ink"/><rect x="1330" y="2310" width="420" height="220" rx="45" fill="#666" stroke="#222" stroke-width="10"/><circle cx="1260" cy="2420" r="55" fill="#333"/><line x1="1260" y1="2475" x2="1260" y2="2600" class="ink"/><rect class="cap" x="140" y="260" width="360" height="110"/><text x="190" y="330" class="c">September air.</text><rect class="cap" x="140" y="410" width="690" height="125"/><text x="190" y="490" class="c">Lake went black about an hour ago.</text><rect class="cap" x="140" y="575" width="1050" height="160"/><text x="190" y="645" class="c">Same town. Same roads. Same people</text><text x="190" y="690" class="c">pretending tomorrow was guaranteed.</text><rect class="cap" x="1260" y="500" width="600" height="155"/><text x="1320" y="565" class="c">Wasn’t anything special.</text><text x="1320" y="610" class="c">That’s what gets me.</text><text x="90" y="2990" class="n">No anomaly. Real CDA geography. Protagonist small beside truck near bar; optional tiny white sedan in ordinary traffic.</text></svg>