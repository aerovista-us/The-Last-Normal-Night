name: Build EP1 magazine cover

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Build real magazine cover
        run: python comic/issues/01-the-last-normal-night/production/build_magazine_cover.py
      - name: Rebuild publication package
        run: python comic/issues/01-the-last-normal-night/production/build_publication.py
      - name: Verify production dimensions
        run: |
          python - <<'PY'
          from PIL import Image
          p='comic/issues/01-the-last-normal-night/pages/00-cover-front.png'
          assert Image.open(p).size == (2063,3150)
          print('cover verified', Image.open(p).size)
          PY
      - name: Commit generated cover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comic/issues/01-the-last-normal-night/pages/00-cover-front.png \
                  comic/issues/01-the-last-normal-night/pages/00-cover-front-web.jpg \
                  comic/issues/01-the-last-normal-night/EP1-The-Last-Normal-Night.cbz \
                  comic/issues/01-the-last-normal-night/production/artifacts/rack-issue-1.json \
                  comic/issues/01-the-last-normal-night/production/artifacts/PUBLICATION_EP1_2026-09-14.json
          if git diff --cached --quiet; then
            echo 'No cover changes.'
          else
            git commit -m 'Promote EP1 real magazine cover'
            git push
          fi
