name: Build corrected EP1 opening pages

on:
  push:
    branches: [main]
    paths:
      - 'comic/issues/01-the-last-normal-night/production/build_corrected_opening.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build corrected Pages 01-06 only
        run: python comic/issues/01-the-last-normal-night/production/build_corrected_opening.py
      - name: Verify corrected opening masters
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('comic/issues/01-the-last-normal-night/pages')
          failures=[]
          for n in range(1,7):
              p=root/f'p{n:02d}.png'
              if not p.exists():
                  failures.append(f'missing {p}')
                  continue
              try:
                  with Image.open(p) as im:
                      if im.size != (2063,3150):
                          failures.append(f'{p}: {im.size}, expected 2063x3150')
                      im.verify()
              except Exception as exc:
                  failures.append(f'{p}: invalid PNG: {exc}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('CORRECTED OPENING QA PASS: p01-p06 exist, decode, and are 2063x3150')
          PY
      - name: Commit corrected opening pages
        run: |
          git config user.name 'AeroVista Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add comic/issues/01-the-last-normal-night/pages/p0[1-6].png
          if git diff --cached --quiet; then
            echo 'No corrected page changes to commit.'
          else
            git commit -m 'Rebuild corrected EP1 pages 01-06'
            git push
          fi
