name: Build EP1 canonical pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build canonical missing/rebuilt pages
        run: python comic/issues/01-the-last-normal-night/production/generate_missing_pages.py
      - name: Normalize Pages 09-18 to print master resolution
        run: python comic/issues/01-the-last-normal-night/production/normalize_existing_pages.py
      - name: Verify complete EP1 PNG master sequence
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('comic/issues/01-the-last-normal-night/pages')
          need=list(range(1,25))
          failures=[]
          for n in need:
              p=root/f'p{n:02d}.png'
              if not p.exists():
                  failures.append(f'missing {p}')
                  continue
              try:
                  with Image.open(p) as im:
                      if im.size != (2063,3150):
                          failures.append(f'{p}: {im.size}, expected 2063x3150')
                      im.verify()
              except Exception as exc:
                  failures.append(f'{p}: invalid PNG: {exc}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('EP1 QA PASS: 24/24 PNG masters exist, decode, and are 2063x3150')
          PY
      - name: Commit complete EP1 page masters
        run: |
          git config user.name 'AeroVista Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add comic/issues/01-the-last-normal-night/pages/p0[1-9].png
          git add comic/issues/01-the-last-normal-night/pages/p1[0-9].png
          git add comic/issues/01-the-last-normal-night/pages/p2[0-4].png
          if git diff --cached --quiet; then
            echo 'No page changes to commit.'
          else
            git commit -m 'Finalize EP1 24-page master sequence'
            git push
          fi
