name: Build corrected EP1 pages through 24

on:
  push:
    branches: [main]
    paths:
      - 'comic/issues/01-the-last-normal-night/production/build_corrected_opening.py'
      - 'comic/issues/01-the-last-normal-night/production/build_corrected_p07_p12.py'
      - 'comic/issues/01-the-last-normal-night/production/build_corrected_p14_p16.py'
      - 'comic/issues/01-the-last-normal-night/production/build_corrected_p17_p24.py'
      - '.github/workflows/build-ep1-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install --disable-pip-version-check pillow
      - name: Lock Page 13 before render
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('comic/issues/01-the-last-normal-night/pages/p13.png')
          expected='ed616f61e9fb3976f5e25f128dc7d1d80205a7a89836ee8a9590fbf878f094d0'
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          print('P13 pre-render SHA-256:', got)
          if got != expected:
              raise SystemExit(f'P13 preservation lock failed before render: {got}')
          PY
      - name: Build corrected Pages 01-06
        run: python comic/issues/01-the-last-normal-night/production/build_corrected_opening.py
      - name: Build corrected Pages 07-12
        run: python comic/issues/01-the-last-normal-night/production/build_corrected_p07_p12.py
      - name: Build continuous rupture spread and Page 16
        run: python comic/issues/01-the-last-normal-night/production/build_corrected_p14_p16.py
      - name: Build corrected Pages 17-24
        run: python comic/issues/01-the-last-normal-night/production/build_corrected_p17_p24.py
      - name: Verify promoted masters
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          import hashlib
          root=Path('comic/issues/01-the-last-normal-night')
          pages=root/'pages'
          failures=[]
          for n in range(1,25):
              p=pages/f'p{n:02d}.png'
              if not p.exists():
                  failures.append(f'missing {p}')
                  continue
              try:
                  with Image.open(p) as im:
                      if im.size != (2063,3150):
                          failures.append(f'{p}: {im.size}, expected 2063x3150')
                      im.verify()
              except Exception as exc:
                  failures.append(f'{p}: invalid PNG: {exc}')
          spread=root/'production'/'artifacts'/'p14-p15-spread-master.png'
          if not spread.exists():
              failures.append(f'missing {spread}')
          else:
              with Image.open(spread) as im:
                  if im.size != (4050,3150):
                      failures.append(f'{spread}: {im.size}, expected 4050x3150')
          p13=pages/'p13.png'
          expected='ed616f61e9fb3976f5e25f128dc7d1d80205a7a89836ee8a9590fbf878f094d0'
          got=hashlib.sha256(p13.read_bytes()).hexdigest()
          if got != expected:
              failures.append(f'P13 changed: {got}')
          with Image.open(pages/'p14.png') as a, Image.open(pages/'p15.png') as b:
              a=a.convert('RGB'); b=b.convert('RGB')
              overlap=ImageChops.difference(a.crop((2063-76,0,2063,3150)), b.crop((0,0,76,3150)))
              if overlap.getbbox() is not None:
                  failures.append('P14/P15 76px center overlap is not byte-pixel identical')
          manifest=root/'production'/'artifacts'/'PROMOTION_2026-09-13.md'
          if not manifest.exists():
              failures.append(f'missing {manifest}')
          ending_manifest=root/'production'/'artifacts'/'PROMOTION_P17_P24_2026-09-14.md'
          if not ending_manifest.exists():
              failures.append(f'missing {ending_manifest}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('EP1 QA PASS: p01-p24 valid; spread 4050x3150; P13 unchanged; overlap verified')
          PY
      - name: Commit promoted pages, spread master, and ending
        run: |
          git config user.name 'AeroVista Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add comic/issues/01-the-last-normal-night/pages/p0[1-9].png
          git add comic/issues/01-the-last-normal-night/pages/p1[0-2].png
          git add comic/issues/01-the-last-normal-night/pages/p1[4-9].png
          git add comic/issues/01-the-last-normal-night/pages/p2[0-4].png
          git add comic/issues/01-the-last-normal-night/production/artifacts/p14-p15-spread-master.png
          git add comic/issues/01-the-last-normal-night/production/artifacts/PROMOTION_2026-09-13.md
          git add comic/issues/01-the-last-normal-night/production/artifacts/PROMOTION_P17_P24_2026-09-14.md
          if git diff --cached --quiet; then
            echo 'No promoted page changes to commit.'
          else
            git commit -m 'Promote corrected EP1 pages through 24'
            git push
          fi
