name: Build EP1 canonical pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build missing canonical pages
        run: python comic/issues/01-the-last-normal-night/production/generate_missing_pages.py
      - name: Verify PNG masters
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('comic/issues/01-the-last-normal-night/pages')
          need=list(range(1,9))+list(range(19,25))
          for n in need:
              p=root/f'p{n:02d}.png'
              assert p.exists(), p
              with Image.open(p) as im:
                  assert im.size==(2063,3150), (p, im.size)
          print('verified', len(need), 'generated page masters')
          PY
      - name: Commit generated page masters
        run: |
          git config user.name 'AeroVista Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add comic/issues/01-the-last-normal-night/pages/p0[1-8].png
          git add comic/issues/01-the-last-normal-night/pages/p1[9].png
          git add comic/issues/01-the-last-normal-night/pages/p2[0-4].png
          if git diff --cached --quiet; then
            echo 'No page changes to commit.'
          else
            git commit -m 'Build canonical EP1 page masters'
            git push
          fi
